<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学内掲示板 | バウンティ大学</title>

<style>
:root {
  --blue: #2563eb;
  --sky: #16110a;
  --red: #d92535;
  --red-dark: #a91624;
  --ink: #f8ead2;
  --muted: #c9b58c;
  --line: rgba(255, 201, 92, 0.24);
  --gold: #ffc95c;
  --soft: #1f180f;
  --shadow: 0 18px 45px rgba(0, 0, 0, 0.32);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, Arial, sans-serif;
  line-height: 1.7;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,201,92,0.18) 0 8%, transparent 9%),
    radial-gradient(circle at 88% 13%, rgba(217,37,53,0.14) 0 7%, transparent 8%),
    linear-gradient(180deg, #090704 0%, #171008 42%, #24190d 100%);
}

a {
  color: inherit;
  text-decoration: none;
}

.site-header {
  border-bottom: 1px solid rgba(255, 201, 92, 0.22);
  background: rgba(9, 7, 4, 0.9);
  backdrop-filter: blur(12px);
}

.header-inner,
.page-hero,
.news-section,
.footer-inner {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

.header-inner {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
}

.brand-mark {
  width: 46px;
  height: 46px;
  object-fit: cover;
  border-radius: 8px;
  box-shadow: 0 10px 22px rgba(255, 201, 92, 0.22);
}

.brand-sub {
  display: block;
  color: var(--gold);
  font-size: 0.78rem;
}

.nav {
  display: flex;
  gap: 8px;
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 900;
}

.nav a {
  padding: 9px 12px;
  border-radius: 6px;
}

.nav a:hover {
  color: var(--gold);
  background: rgba(255, 201, 92, 0.12);
}

.page-hero {
  padding: 44px 0 32px;
}

.eyebrow {
  width: fit-content;
  margin: 0 0 14px;
  padding: 6px 12px;
  color: #1a1106;
  font-size: 0.86rem;
  font-weight: 900;
  border: 1px solid rgba(255, 201, 92, 0.34);
  border-radius: 999px;
  background: linear-gradient(135deg, #ffe19a, var(--gold));
}

h1 {
  margin: 0;
  color: #fff6db;
  font-size: clamp(2rem, 5vw, 3.8rem);
  line-height: 1.08;
  letter-spacing: 0;
}

.lead {
  max-width: 720px;
  margin: 14px 0 0;
  color: var(--muted);
  font-weight: 800;
}

.news-section {
  padding: 18px 0 64px;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
}

.news-card {
  min-width: 0;
  display: flex;
  overflow: hidden;
  min-height: 100%;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(24, 18, 10, 0.92);
  box-shadow: var(--shadow);
}

.news-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 20px 42px rgba(0, 0, 0, 0.34);
}

.news-image {
  width: 100%;
  aspect-ratio: 16 / 9;
  display: block;
  object-fit: cover;
  background: rgba(255, 201, 92, 0.12);
}

.news-body {
  display: flex;
  flex: 1;
  flex-direction: column;
  padding: 18px;
}

.news-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 10px;
}

.news-date {
  color: var(--gold);
  font-size: 0.86rem;
  font-weight: 900;
}

.news-category {
  padding: 3px 9px;
  color: var(--gold);
  font-size: 0.78rem;
  font-weight: 900;
  border: 1px solid rgba(255, 201, 92, 0.32);
  border-radius: 999px;
  background: rgba(255, 201, 92, 0.12);
}

.news-title {
  margin: 0 0 10px;
  color: #fff6db;
  font-size: 1.14rem;
  line-height: 1.38;
}

.news-text {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 0.95rem;
  font-weight: 700;
}

.news-more {
  margin-top: auto;
  color: var(--gold);
  font-weight: 900;
}

.empty-message {
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(24, 18, 10, 0.92);
}

.back-link {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  margin-top: 26px;
  padding: 11px 18px;
  color: #1a1106;
  font-weight: 900;
  border-radius: 8px;
  background: linear-gradient(135deg, #ffe19a, var(--gold));
  box-shadow: 0 12px 26px rgba(255, 201, 92, 0.24);
}

.site-footer {
  padding: 30px 0;
  color: #fff;
  background: #090704;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-weight: 900;
}

.footer-inner p {
  margin: 0;
}

.footer-motto {
  color: var(--gold);
}

@media (max-width: 860px) {
  .header-inner {
    padding: 12px 0;
    align-items: flex-start;
    flex-direction: column;
  }

  .nav {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 3px;
  }

  .news-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 560px) {
  .header-inner,
  .page-hero,
  .news-section,
  .footer-inner {
    width: min(100% - 24px, 1120px);
  }

  .brand-mark {
    width: 40px;
    height: 40px;
  }

  .page-hero {
    padding: 32px 0 22px;
  }

  .news-grid {
    grid-template-columns: 1fr;
  }

  .news-body {
    padding: 16px;
  }

  .footer-inner {
    align-items: flex-start;
    flex-direction: column;
  }
}

/* 共通フッター */
.legal-footer {
  margin-top: 34px;
  padding: 24px 0;
  color: #fff;
  background: #090704;
  border-radius: 8px 8px 0 0;
}

.legal-footer-inner {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  gap: 18px;
  align-items: flex-start;
}

.legal-footer-title {
  margin: 0 0 4px;
  font-weight: 900;
}

.legal-footer p {
  margin: 0;
}

.legal-footer-note {
  max-width: 620px;
  color: #d8c49b;
  font-size: 0.88rem;
  font-weight: 700;
  line-height: 1.65;
}

@media (max-width: 560px) {
  .legal-footer {
    margin-top: 28px;
    padding: 22px 0;
  }

  .legal-footer-inner {
    width: min(100% - 24px, 1120px);
    flex-direction: column;
  }
}
</style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="バウンティ大学トップ">
        <img src="logo.png" class="brand-mark" alt="バウンティ大学校章">
        <span>
          バウンティ大学【レクサカ】
          <span class="brand-sub">Bounty University</span>
        </span>
      </a>

      <nav class="nav" aria-label="主要メニュー">
        <a href="index.html">トップ</a>
        <a href="index.html#freshman">新入生</a>
        <a href="index.html#faculties">学部</a>
        <a href="index.html#lectures">講義一覧</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <p class="eyebrow">お知らせ掲示板</p>
    <h1>学内掲示板</h1>
    <p class="lead">大学から学生へ届く、お宝への地図を掲示します。動画講義、ガチャ研究室、裏講義の最新情報をまとめています。</p>
  </section>

  <main class="news-section">
    <div id="news-grid" class="news-grid" aria-live="polite"></div>
    <a class="back-link" href="index.html">大学トップへ戻る</a>
  </main>

  <script src="news-data.js"></script>
  <script>
    (() => {
      const grid = document.getElementById('news-grid');
      const newsItems = window.BOUNTY_NEWS || [];

      if (!newsItems.length) {
        grid.innerHTML = '<p class="empty-message">現在掲載中のお知らせはありません。</p>';
        return;
      }

      grid.innerHTML = newsItems.map((item) => `
        <article class="news-card">
          <a href="${item.link}">
            <img class="news-image" src="${item.image}" alt="${item.title}">
          </a>
          <div class="news-body">
            <div class="news-meta">
              <span class="news-date">${item.date}</span>
              <span class="news-category">${item.category}</span>
            </div>
            <h2 class="news-title">
              <a href="${item.link}">${item.title}</a>
            </h2>
            <p class="news-text">${item.body}</p>
            <a class="news-more" href="${item.link}">授業を見る</a>
          </div>
        </article>
      `).join('');
    })();
  </script>

<footer class="legal-footer">
  <div class="legal-footer-inner">
    <div>
      <p class="legal-footer-title">バウンティ大学【レクサカ】</p>
      <p>本サイトは非公式ファンサイトです。</p>
    </div>
    <p class="legal-footer-note">著作権はバンダイナムコエンターテインメント及び各権利者に帰属します。</p>
  </div>
</footer>
</body>
</html>
