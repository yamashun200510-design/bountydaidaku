<ul>
<li>カイドウメダル</li>

</ul>

<h2>おすすめ理由</h2>
<p>
カイドウメダルと火災メダルで、被弾時にスキル1を短縮できる構成。
さらにKO時にもスキル1短縮が入り、黒ひげの重要スキルである黒渦を高回転で回せる。
</p>

<p>
スキル1の黒渦は、現環境のニカやローなどを落とせる強力なスキル。
黒ひげを使うなら、黒渦の回転率を上げる価値が非常に高い。
</p>
