<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<title>メダル検索テスト</title>
</head>
<body>

<h1>メダル検索テスト</h1>

<input id="medalInput" placeholder="悪魔咲きメダル">

<button onclick="searchMedal()">
検索
</button>

<div id="result"></div>

<div id="tagEffect"></div>

<script src="medals.js"></script>
<script src="tags.js"></script>

<script>

function searchMedal() {

  const medalName =
    document.getElementById("medalInput").value;

  const results =
  medals.filter(m =>
    m.name.includes(medalName) ||
    m.effect.includes(medalName) ||
    m.tags.some(tag => tag.includes(medalName))
  );

 if (results.length === 0) {
  document.getElementById("result").innerHTML =
    "メダルが見つかりません";
  return;
}
document.getElementById("result").innerHTML =
  results.map(medal => `
    <h2>${medal.name}</h2>

    <h3>タグ</h3>

    <ul>
      ${medal.tags.map(tag =>
  `<li>
    <button onclick="showTagEffect('${tag}')">
      ${tag}
    </button>
  </li>`
).join("")}
    </ul>

    <h3>固有特性</h3>

    <p>${medal.effect}</p>

  
    <hr>
  `).join("");
   
}
  function showTagEffect(tagName) {

  const group = tags[tagName];

  if (!group) {
    document.getElementById("tagEffect").innerHTML =
      `${tagName} のタグ効果データがありません`;
    return;
  }

  const effect = tagGroups[group];

  document.getElementById("tagEffect").innerHTML = `
    <h2>${tagName}</h2>

    <p>2セット</p>
    <p>${effect.two}</p>

    <p>3セット</p>
    <p>${effect.three}</p>
  `;
}

</script>

</body>
</html>
